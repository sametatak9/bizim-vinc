services:
  - type: web
    name: bizim-vinc-erp
    runtime: static
    repo: https://github.com/sametatak9/bizim-vinc
    branch: main
    autoDeploy: true
    buildCommand: npm install --legacy-peer-deps && npm run build
    staticPublishPath: artifacts/bizim-vinc-erp/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
