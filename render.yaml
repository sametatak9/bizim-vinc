services:
  - type: web
    name: bizim-vinc-erp
    runtime: static
    buildCommand: cd artifacts/bizim-vinc-erp && npm install --legacy-peer-deps && npm run build
    staticPublishPath: artifacts/bizim-vinc-erp/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
