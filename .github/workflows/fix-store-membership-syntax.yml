name: fix-store-membership-syntax
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-store-membership-syntax.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch store requestMembership
        run: |
          set -e
          python3 -c '
          from pathlib import Path
          for sp in ["src/lib/store.tsx", "artifacts/bizim-vinc-erp/src/lib/store.tsx"]:
            p = Path(sp)
            if not p.exists():
              continue
            t = p.read_text()
            a = "): Promise<{\n    // KVKK: never send plaintext TC\n    tcNoOrHash = (await hashTcIdentity(tcNoOrHash)) || tcNoOrHash;\n success: boolean; message: string }> => {\n    const id = generateUuid();"
            b = "): Promise<{ success: boolean; message: string }> => {\n    // KVKK: never send plaintext TC\n    tcNoOrHash = (await hashTcIdentity(tcNoOrHash)) || tcNoOrHash;\n    const id = generateUuid();"
            if a in t:
              p.write_text(t.replace(a, b, 1))
              print("FIXED", sp)
            else:
              print("NOMATCH", sp)
          '
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "fix(store): requestMembership TC-hash syntax (P0-A)"
          git push
